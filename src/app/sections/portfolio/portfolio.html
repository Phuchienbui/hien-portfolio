<section id="portfolio" class="section portfolio">
  <div class="container portfolio__layout">
    <div class="portfolio__intro">
      <h2 class="portfolio__title">{{ text().title }}</h2>
      <p>{{ text().intro }}</p>
    </div>

    <ul class="portfolio__grid">
      @for (project of projects; track project.id) {
        <li>
          <app-project-card
            [project]="project"
            [description]="text().descriptions[project.id]"
            [labels]="text().card"
          />
        </li>
      }
    </ul>
  </div>
</section>
