<section id="hero" class="hero">
  <div class="container hero__content">
    <div class="hero__title-block">
      <p class="hero__greeting">{{ text().greeting }}</p>
      <div class="hero__headline">
        <h1 class="hero__name">{{ site().name }}</h1>
        <p class="hero__role">{{ text().role }}</p>
      </div>
    </div>

    <a class="hero__cta" routerLink="/" fragment="contact">{{ text().ctaLabel }}</a>

    <nav class="hero__socials" [attr.aria-label]="social().label">
      <ul class="hero__social-list">
        @for (link of socialLinks(); track link.icon) {
          <li>
            <a
              class="hero__social-link"
              [href]="link.href"
              [attr.aria-label]="link.label"
              [attr.target]="link.isExternal ? '_blank' : null"
              [attr.rel]="link.isExternal ? 'noopener noreferrer' : null"
            >
              <img [src]="'icons/' + link.icon + '.svg'" alt="" width="30" height="30" />
            </a>
          </li>
        }
      </ul>
    </nav>

    <a class="hero__scroll" routerLink="/" fragment="about">
      {{ text().scrollLabel }}
      <img src="icons/arrow-down-line.svg" alt="" width="24" height="24" />
    </a>
  </div>
</section>
