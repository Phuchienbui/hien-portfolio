server {
    listen 80;
    listen [::]:80;
    server_name PROJEKT.DEINE-DOMAIN.de;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://PROJEKT.DEINE-DOMAIN.de$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name PROJEKT.DEINE-DOMAIN.de;

    ssl_certificate /etc/letsencrypt/live/PROJEKT.DEINE-DOMAIN.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PROJEKT.DEINE-DOMAIN.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/projekte/PROJEKT;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
